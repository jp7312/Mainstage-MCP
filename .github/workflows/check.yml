name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Lua
        run: brew install lua
      - name: Create environment
        run: make bootstrap PYTHON=python3
      - name: Smoke test console script
        run: .venv/bin/mainstage-mcp --version
      - name: Build native bridge
        run: make build
      - name: Check installed dependencies
        run: .venv/bin/python -m pip check
      - name: Run offline checks
        run: make test
      - name: Install ruff
        run: .venv/bin/python -m pip install ruff==0.16.8
      - name: Run lint
        run: make lint RUFF=.venv/bin/ruff
      # CoreMIDI loopback and MainStage round trips are separate local checks.

  profile-lua:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # MainStage 4.3.1 embeds Lua 5.2; the profile also stays 5.1-compatible for older hosts.
        lua-version: ['5.2', '5.1']
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua${{ matrix.lua-version }}
      - name: Check Lua version
        run: lua${{ matrix.lua-version }} -v -e "assert(_VERSION == 'Lua ${{ matrix.lua-version }}', _VERSION)"
      - name: Run Lua profile checks
        run: lua${{ matrix.lua-version }} tests/check-profile.lua
