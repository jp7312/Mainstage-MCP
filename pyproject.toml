[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "mainstage-mcp"
version = "0.1.0a2"
description = "Local MCP access to MainStage through CoreMIDI and a small controller profile"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp==2.2.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

[project.scripts]
mainstage-mcp = "mainstage_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mainstage_mcp = ["profile.lua"]
